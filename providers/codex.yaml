# EKKA Codex desks use an OpenAI API key as an Authorization bearer credential.
# In-desk OAuth refresh is unsupported. A refresh response would expose fresh
# tokens to the sandbox, and rotation would invalidate the gateway's stored copy.
# Keep request-body credential substitution disabled. Gateway-managed refresh
# requires a provider that keeps token issuance and rotation outside the sandbox.

id: codex
display_name: Codex
description: OpenAI Codex CLI
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/codex, /usr/local/bin/codex, /usr/lib/node_modules/@openai/**]
