[package]
name = "ekka-desk-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Installs and checks an EKKA desk host: NVIDIA OpenShell's gateway, EKKA's backend adapter and the Enclave's services"
publish = false

[[bin]]
name = "ekka-desk-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.9"
getrandom = "0.2.15"
libc = "0.2.182"
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "ring", "pem"] }
rustix = { version = "1.1.3", features = ["fs", "process"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
time = "0.3.47"
toml = "0.8.23"
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.25.0"

[profile.release]
codegen-units = 1
lto = "thin"
